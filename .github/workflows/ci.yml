name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env: { PGPASSWORD: postgres, PGHOST: localhost, PGUSER: postgres }
    steps:
      - uses: actions/checkout@v4
      - run: bash ./backend/db/run-tests.sh -h localhost -U postgres
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: backend/global.json }
      - run: dotnet test backend/GoldValuation.slnx
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  images:
    runs-on: ubuntu-latest
    needs: [database, backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile.api -t gilded-api .
      - run: docker build -f deploy/Dockerfile.web -t gilded-web .