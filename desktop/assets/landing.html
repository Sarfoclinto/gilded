<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gilded</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <style>
      :root {
        --navy: #0d1b2e;
        --navy2: #1e3a5f;
        --gold: #c9a84c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #fff;
        font:
          15px system-ui,
          "Segoe UI",
          sans-serif;
        background: radial-gradient(
          1200px 700px at 50% -10%,
          var(--navy2) 0%,
          var(--navy) 60%
        );
      }
      main {
        width: min(460px, 90vw);
        text-align: center;
      }
      .logo {
        width: 76px;
        height: 76px;
        margin: 0 auto 22px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, #e6cf86, var(--gold) 55%, #a68a36);
        color: var(--navy);
        font:
          700 40px Georgia,
          serif;
        box-shadow:
          0 18px 50px rgba(201, 168, 76, 0.25),
          inset 0 1px 0 rgba(255, 255, 255, 0.5);
      }
      h1 {
        margin: 0;
        font:
          400 34px Georgia,
          serif;
        letter-spacing: 0.22em;
      }
      .tag {
        margin: 8px 0 34px;
        color: rgba(255, 255, 255, 0.55);
        letter-spacing: 0.18em;
        font-size: 11px;
        text-transform: uppercase;
      }
      .bar {
        height: 3px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
        margin: 0 auto 18px;
        width: 220px;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 40%;
        background: var(--gold);
        border-radius: 3px;
        animation: slide 1.2s ease-in-out infinite;
      }
      .done .bar i {
        animation: none;
        width: 100%;
      }
      @keyframes slide {
        0% {
          margin-left: -40%;
        }
        100% {
          margin-left: 100%;
        }
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        min-height: 24px;
        color: rgba(255, 255, 255, 0.85);
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--gold);
        animation: pulse 1.2s infinite;
      }
      .on .dot {
        background: #34d399;
        animation: none;
      }
      .off .dot {
        background: #fbbf24;
        animation: none;
      }
      .bad .dot {
        background: #f87171;
        animation: none;
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }
      .note {
        margin: 10px auto 0;
        max-width: 360px;
        color: rgba(255, 255, 255, 0.55);
        font-size: 13px;
        min-height: 36px;
      }
      button {
        margin-top: 22px;
        padding: 11px 28px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: transparent;
        color: #fff;
        font: 600 14px inherit;
        cursor: pointer;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      footer {
        position: fixed;
        bottom: 16px;
        left: 0;
        right: 0;
        text-align: center;
        color: rgba(255, 255, 255, 0.3);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main id="m">
      <div class="logo">G</div>
      <h1 id="name">GILDED</h1>
      <div class="tag">Gold buying &amp; valuation</div>
      <div class="bar"><i></i></div>
      <div class="status" id="status">
        <span class="dot"></span><span id="st">Starting…</span>
      </div>
      <div class="note" id="note"></div>
      <button id="go" hidden>Open now</button>
    </main>
    <footer id="ver"></footer>
    <script>
      const $ = (id) => document.getElementById(id),
        m = $("m");
      const open = () => window.gilded.launch.open();
      (async () => {
        const info = await window.gilded.launch.info();
        $("name").textContent = (info.companyName || "Gilded").toUpperCase();
        document.title = info.companyName || "Gilded";
        $("ver").textContent = "Version " + info.version;
        if (!info.configured) {
          m.className = "done";
          m.classList.add("bad");
          $("st").textContent = "This copy is not set up yet";
          $("note").textContent =
            "It has no company server built in. Please install the version your company gave you, or contact support.";
          return;
        }
        $("st").textContent = "Connecting to your company…";
        const t0 = Date.now();
        const r = await window.gilded.launch.check();
        const wait = Math.max(0, 900 - (Date.now() - t0));
        await new Promise((res) => setTimeout(res, wait));
        m.classList.add("done");
        if (r.online) {
          m.classList.add("on");
          $("st").textContent = "Connected";
          $("note").textContent = "Everything is up to date.";
        } else {
          m.classList.add("off");
          $("st").textContent = "No connection";
          $("note").textContent =
            "Opening with the data stored on this computer. Purchases are saved here and sent when the connection returns.";
        }
        $("go").hidden = false;
        $("go").onclick = open;
        setTimeout(open, r.online ? 700 : 1800);
      })();
    </script>
  </body>
</html>
