<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Gilded</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  :root{--navy:#0d1b2e;--navy2:#1e3a5f;--gold:#c9a84c}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;color:#fff;font:15px system-ui,"Segoe UI",sans-serif;
    background:radial-gradient(1200px 700px at 50% -10%,var(--navy2) 0%,var(--navy) 60%)}
  main{width:min(460px,90vw);text-align:center}
  .logo{width:76px;height:76px;margin:0 auto 22px;border-radius:20px;display:grid;place-items:center;
    background:linear-gradient(145deg,#e6cf86,var(--gold) 55%,#a68a36);color:var(--navy);font:700 40px Georgia,serif;
    box-shadow:0 18px 50px rgba(201,168,76,.25),inset 0 1px 0 rgba(255,255,255,.5)}
  h1{margin:0;font:400 34px Georgia,serif;letter-spacing:.22em}
  .tag{margin:8px 0 34px;color:rgba(255,255,255,.55);letter-spacing:.18em;font-size:11px;text-transform:uppercase}
  .bar{height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin:0 auto 18px;width:220px}
  .bar i{display:block;height:100%;width:40%;background:var(--gold);border-radius:3px;animation:slide 1.2s ease-in-out infinite}
  .done .bar i{animation:none;width:100%}
  @keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
  .status{display:inline-flex;align-items:center;gap:9px;min-height:24px;color:rgba(255,255,255,.85)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);animation:pulse 1.2s infinite}
  .on .dot{background:#34d399;animation:none}.off .dot{background:#fbbf24;animation:none}.bad .dot{background:#f87171;animation:none}
  @keyframes pulse{50%{opacity:.3}}
  .note{margin:10px auto 0;max-width:360px;color:rgba(255,255,255,.55);font-size:13px;min-height:36px}
  button{margin-top:22px;padding:11px 28px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;font:600 14px inherit;cursor:pointer}
  button:hover{background:rgba(255,255,255,.08)}
  footer{position:fixed;bottom:16px;left:0;right:0;text-align:center;color:rgba(255,255,255,.3);font-size:12px}
</style></head>
<body><main id="m">
  <div style="margin:0 auto 18px;width:96px"><svg width="96" height="100" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420">
<defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0d98f"/><stop offset=".55" stop-color="#d8a94e"/><stop offset="1" stop-color="#b9823a"/></linearGradient></defs>
<g fill="url(#lg)" fill-rule="evenodd"><path d="M30 75 L78 118 L118 42 L160 100 L200 8 L240 100 L282 42 L322 118 L370 75 L342 168 Q200 188 58 168 Z M118 78 a13 13 0 1 0 0.1 0 Z M282 78 a13 13 0 1 0 0.1 0 Z M200 96 l11 17 l-11 17 l-11 -17 Z"/><path d="M216.125 257.0Q210.5 232.25 197.375 221.1875Q184.25 210.125 160.375 210.125Q131.375 210.125 117.8125 229.8125Q104.25 249.5 104.25 291.875Q104.25 333.875 117.25 353.6875Q130.25 373.5 157.75 373.5Q168.25 373.5 177.25 371.125Q186.25 368.75 193.625 364.0V312.75H171.125V297.75H238.375V369.375Q217.375 379.125 196.4375 383.875Q175.5 388.625 153.625 388.625Q105.625 388.625 78.1875 362.75Q50.75 336.875 50.75 291.875Q50.75 246.75 78.1875 220.875Q105.625 195.0 153.625 195.0Q173.625 195.0 193.0 199.0Q212.375 203.0 232.0 211.125V257.0Z"/><path d="M301.125 277.0Q295.5 252.25 282.375 241.1875Q269.25 230.125 245.375 230.125Q216.375 230.125 202.8125 249.8125Q189.25 269.5 189.25 311.875Q189.25 353.875 202.25 373.6875Q215.25 393.5 242.75 393.5Q253.25 393.5 262.25 391.125Q271.25 388.75 278.625 384.0V332.75H256.125V317.75H323.375V389.375Q302.375 399.125 281.4375 403.875Q260.5 408.625 238.625 408.625Q190.625 408.625 163.1875 382.75Q135.75 356.875 135.75 311.875Q135.75 266.75 163.1875 240.875Q190.625 215.0 238.625 215.0Q258.625 215.0 278.0 219.0Q297.375 223.0 317.0 231.125V277.0Z"/></g></svg></div>
  <h1 id="name">GILDED</h1>
  <div class="tag">Gold buying &amp; valuation</div>
  <div class="bar"><i></i></div>
  <div class="status" id="status"><span class="dot"></span><span id="st">Starting…</span></div>
  <div class="note" id="note"></div>
  <button id="go" hidden>Open now</button>
  <form id="srv" hidden style="margin-top:18px">
    <input id="addr" placeholder="https://gilded.yourcompany.com" autocomplete="off" spellcheck="false" style="width:100%;padding:11px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff;font:15px inherit">
    <button type="submit" id="save">Save and connect</button>
    <div class="note" id="err" style="color:#f87171"></div>
  </form>
</main>
<footer id="ver"></footer>
<script>
  const $=id=>document.getElementById(id), m=$('m');
  const open=()=>window.gilded.launch.open();
  (async()=>{
    const info=await window.gilded.launch.info();
    $('name').textContent=(info.companyName||'Gilded').toUpperCase();
    document.title=info.companyName||'Gilded';
    $('ver').textContent='Version '+info.version;
    const change=new URLSearchParams(location.search).has('change');
    if(!info.configured||change){
      m.className='done'; if(!info.configured) m.classList.add('bad');
      $('st').textContent=info.configured?'Company server address':'Enter your company server address';
      $('note').textContent='Ask the person who set up Gilded for the address. Use http://localhost for a demo on this computer.';
      $('srv').hidden=false; $('addr').value=(await window.gilded.launch.server())||''; $('addr').focus();
      $('srv').onsubmit=async(e)=>{e.preventDefault();const r=await window.gilded.launch.setServer($('addr').value);
        if(r.ok) location.href=location.pathname.replace(/[?].*$/,''); else $('err').textContent=r.message;};
      return;
    }
    $('st').textContent='Connecting to your company…';
    const t0=Date.now();
    const r=await window.gilded.launch.check();
    const wait=Math.max(0,900-(Date.now()-t0)); await new Promise(res=>setTimeout(res,wait));
    m.classList.add('done');
    if(r.online){ m.classList.add('on'); $('st').textContent='Connected'; $('note').textContent='Everything is up to date.'; }
    else { m.classList.add('off'); $('st').textContent='No connection'; $('note').textContent='Opening with the data stored on this computer. Purchases are saved here and sent when the connection returns.'; }
    $('go').hidden=false; $('go').onclick=open;
    setTimeout(open, r.online?700:1800);
  })();
</script></body></html>
