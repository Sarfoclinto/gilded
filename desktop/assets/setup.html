<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gilded setup</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0d1b2e;
        color: #fff;
        font:
          15px system-ui,
          Segoe UI,
          sans-serif;
      }
      main {
        width: min(440px, 92vw);
        background: #fff;
        color: #111;
        border-radius: 14px;
        padding: 28px;
      }
      h1 {
        margin: 0 0 4px;
        font:
          700 22px Georgia,
          serif;
      }
      p {
        color: #555;
        margin: 0 0 18px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 11px 12px;
        border: 1px solid #bbb;
        border-radius: 8px;
        font: inherit;
      }
      button {
        margin-top: 14px;
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 8px;
        background: #0d1b2e;
        color: #fff;
        font: 600 15px inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
      }
      #msg {
        margin-top: 12px;
        min-height: 20px;
        font-size: 14px;
      }
      .bad {
        color: #b91c1c;
      }
      .ok {
        color: #15803d;
      }
      .logo {
        display: inline-grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 9px;
        background: #c9a84c;
        color: #0d1b2e;
        font:
          700 20px Georgia,
          serif;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">G</div>
      <h1>Welcome to Gilded</h1>
      <p>
        Enter the address of your company's Gilded server. Your manager can tell
        you what it is. You only do this once on this computer.
      </p>
      <form id="f">
        <label for="u">Server address</label>
        <input
          id="u"
          placeholder="gilded.yourcompany.com"
          autofocus
          autocomplete="off"
          spellcheck="false"
        />
        <button id="b" type="submit">Connect</button>
        <div id="msg" role="status"></div>
      </form>
    </main>
    <script>
      const f = document.getElementById("f"),
        u = document.getElementById("u"),
        b = document.getElementById("b"),
        m = document.getElementById("msg");
      f.addEventListener("submit", async (e) => {
        e.preventDefault();
        b.disabled = true;
        m.className = "";
        m.textContent = "Checking…";
        const t = await window.gilded.setup.test(u.value);
        if (!t.ok) {
          m.className = "bad";
          m.textContent = t.message || "Could not reach that address.";
          b.disabled = false;
          return;
        }
        m.className = "ok";
        m.textContent = "Connected. Opening Gilded…";
        await window.gilded.setup.save(t.url);
      });
    </script>
  </body>
</html>
