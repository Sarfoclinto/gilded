# Gilded: database + API + web/HTTPS front door. Run from this folder:  docker compose up -d --build
# Settings come from the file named ".env" next to this one (copy .env.example to .env and edit it).
name: gilded

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      GOLD_APP_PASSWORD: ${GOLD_APP_PASSWORD:?set GOLD_APP_PASSWORD in .env}
      GOLD_MIGRATOR_PASSWORD: ${GOLD_MIGRATOR_PASSWORD:?set GOLD_MIGRATOR_PASSWORD in .env}
      TZ: Africa/Accra
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot job: applies any database changes that have not been applied yet, then exits. Safe to run again at any time.
  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    image: gilded-api
    command: ["migrate"]
    restart: "no"
    environment:
      ConnectionStrings__Migrator: Host=db;Port=5432;Database=gold;Username=gold_migrator;Password=${GOLD_MIGRATOR_PASSWORD}
    depends_on:
      db: { condition: service_healthy }

  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    image: gilded-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__App: Host=db;Port=5432;Database=gold;Username=gold_app;Password=${GOLD_APP_PASSWORD}
      ConnectionStrings__Migrator: Host=db;Port=5432;Database=gold;Username=gold_migrator;Password=${GOLD_MIGRATOR_PASSWORD}
      Auth__SigningKey: ${AUTH_SIGNING_KEY:?set AUTH_SIGNING_KEY in .env}
      Auth__DefaultCompany: ${COMPANY_SLUG:?set COMPANY_SLUG in .env}
      Auth__CookieSecure: ${COOKIE_SECURE:-false}
      Swagger__Enabled: "false"
      TZ: Africa/Accra
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddydata:/data
    depends_on:
      - api

volumes:
  dbdata:
  caddydata: