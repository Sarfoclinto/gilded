openapi: 3.0.3
info:
  title: Gold Valuation API
  version: 0.32.0
  description: |
    Contract for the ASP.NET Core API. The web app's zod schemas and the dev mock follow this file.
    Implemented so far: authentication, current user, branches, prices, purchases (with split payments), the opening of a day
    and drawer movements, customers, debts both ways, loans against unrefined gold, and repayments.
    Days are opened, used and closed with a full reconciliation and a manager sign-off.

    Conventions
    - Success: HTTP 2xx with `{ "data": ..., "meta": { ... } }`. `meta` is optional.
    - Failure: a real HTTP status (never 200 for an error) with `{ "error": { code, message, fieldErrors?, traceId } }`.
    - `code` is a stable machine-readable string. The UI branches on `code`, never on `message`.
    - Money is a JSON string of whole cedis ("11832"). Weights, karat and density are JSON strings ("7.77").
      Strings avoid floating point drift; both clients parse them with decimals.
    - Times are ISO 8601 UTC. Writes that may be queued offline carry a client-generated `Idempotency-Key` header (UUID)
      and `X-Client-Time`; the server stores both its own time and the device time.
servers:
  - url: http://localhost:5080/api/v1
x-live-updates: |
  WebSocket hub at /hubs/live (SignalR; not part of /api/v1). Connect with the access token as ?access_token=. Server to browser only.
  Messages: `changed` { topic } (transfers, review, days, payments, prices, ledger, transactions, debts) when data a person may be
  looking at changed; `notification` { id, kind, title, link } for one person; `resync` after the server reconnected to its database.
  The connection is closed when the access token expires; clients reconnect with a fresh one.
tags:
  - name: Photos
  - name: Settings
  - name: Guide
  - name: Auth
  - name: Me
  - name: Branches
  - name: Review
  - name: Notifications
  - name: Prices
  - name: Transactions
  - name: Cash drawer
  - name: Customers and debts
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in. The refresh token is set as an httpOnly, Secure, SameSite cookie scoped to /auth.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
      description: |
        Error codes: `INVALID_CREDENTIALS` (401, the same for a wrong name, wrong password, unknown company, locked or switched-off account, on purpose),
        `VALIDATION_FAILED` (422, with `fieldErrors`), `RATE_LIMITED` (429). Five wrong passwords lock the account for 15 minutes.
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange the refresh cookie for a new access token (rotates the refresh token)
      security: []
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
          description: New access token
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
      description: |
        Sends no body; the httpOnly cookie is the credential and is replaced on every call. Error codes: `SESSION_EXPIRED` (401, cookie cleared,
        sign in again) and `REFRESH_IN_PROGRESS` (409, another tab refreshed a moment ago: wait briefly and call again, or just retry the request that failed).
        A refresh token used again after it was replaced ends that whole login (`SESSION_EXPIRED`).
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the refresh token and clear the cookie
      responses:
        '204': { description: Signed out }
  /me:
    get:
      tags: [Me]
      summary: The signed-in user, role, permissions and branches
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }
  /branches/all:
    get:
      tags: [Branches]
      summary: Every active branch of the company (names only)
      description: For choosing where a transfer goes or which branch sends mobile money. Unlike `/branches`, it is not limited to the caller's assignments.
      responses:
        '200':
          description: Branches
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Branch' }
        '401': { $ref: '#/components/responses/Error' }
  /branches:
    get:
      tags: [Branches]
      summary: Branches the user may see (directors see all, others see their assignments)
      responses:
        '200':
          description: Branches
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Branch' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [People]
      summary: Add a branch
      description: |
        Needs `branches:manage`. The code (2 to 6 letters or digits) appears in every document number and never changes.
        A new branch starts on the latest reference price with margin 0 (provisional) when a price exists. Branch access of other people follows their own assignment, so assign it in Users.
        Directors see it after their next sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                id: { type: string, format: uuid }
                code: { type: string }
                name: { type: string }
                timezone: { type: string, default: Africa/Accra }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/ManagedBranch' } } } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /prices/current:
    get:
      tags: [Prices]
      summary: The price per pound in force for a branch (GoldBod base plus approved margin)
      parameters:
        - in: query
          name: branchId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current price
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CurrentPrice' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { description: 'PRICE_NOT_SET - nothing has been published for this branch yet', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /prices/history:
    get:
      tags: [Prices]
      summary: A branch's price over time, and what it bought each day
      description: |
        `branchId`, `days` (1 to 730, default 30). Returns `{ branchId, days, from, asOf, points, daily }`. `points` are every change of the
        branch's price in the period (`at`, `base` = the published reference price, `margin`, `price` = base + margin, `source`, `status`),
        oldest first, preceded by the price that was in force when the period starts. `daily` is one row per calendar day of the branch with
        purchases (`date`, `purchases`, `top`, `amount`, `avgPrice` = price per pound weighted by weight); cancelled purchases are left out.
        Open to anyone who works in the branch, like the current price.
      parameters:
        - { in: query, name: branchId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: days, schema: { type: integer, minimum: 1, maximum: 730 } }
      responses:
        '200': { description: The history, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
        '403': { $ref: '#/components/responses/Error' }
  /prices/base:
    post:
      tags: [Prices]
      summary: Publish a new reference price per pound (Kumasi)
      description: |
        Needs `kumasi:set-value`. Every branch keeps the margin (and its approval status) it already had against the new
        price, so one call updates every branch. Older prices stay on record, so past purchases keep the price they used.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BasePriceRequest' }
            example: { basePrice: '11458' }
      responses:
        '204': { description: Published }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /prices/margins/{branchId}:
    put:
      tags: [Prices]
      summary: Set a branch's margin (provisional unless approved straight away)
      description: |
        Needs `kumasi:set-value`; `approve: true` additionally needs `prices:approve`. Returns the current price.
      parameters:
        - in: path
          name: branchId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarginRequest' }
            example: { margin: '192', approve: false }
      responses:
        '200': { description: The price now in force, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/CurrentPrice' } } } } } }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /prices/margins/{branchId}/approve:
    post:
      tags: [Prices]
      summary: Approve a branch's provisional margin
      description: Needs `prices:approve`.
      parameters:
        - in: path
          name: branchId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: The price now in force, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/CurrentPrice' } } } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /branches/{id}/overview:
    get:
      tags: [Branches]
      summary: One branch for the administrator
      description: |
        Active workers with their role, a snapshot of what the branch holds by the books (cash total, gold weights and value, debts owed to it, amounts it owes,
        unrefined gold held), today's purchases, the open day, what needs attention (sign-offs, open differences, transfers on the road, mobile money waiting or to send),
        debts, the last six days with how they closed, and the five latest purchases. Needs `reports:read` and a branch the caller works in. Nothing that is still waiting on a device is included.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The overview, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
        '404': { $ref: '#/components/responses/Error' }
  /cash/overview:
    get:
      tags: [Branches]
      summary: Cash by branch for the cash lookup
      description: |
        Each active branch the caller may see, with the cash total and the notes by denomination as the books hold them now, the state of its day,
        and when its cash last moved. `asOf` is when the server read it. Cash recorded on a device that has not synced yet is not included.
        Needs `days:read`. `branchId` narrows to one branch the caller may see.
      parameters:
        - { name: branchId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The cash, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
        '403': { $ref: '#/components/responses/Error' }
  /days/{id}/exchanges:
    post:
      tags: [Days]
      summary: Change notes for a customer who was already paid
      description: |
        The customer gives notes back (`gave`) and is handed other notes (`took`) of exactly the same total value, using different denominations
        on each side (e.g. one 200 for two 100s). Optionally linked to the purchase (`transactionId`). The amount paid does not change; the drawer's notes do.
        Needs `days:manage` at the branch when it is linked to a purchase; without a purchase (a branch changing its own notes) it needs `notes:exchange`, and every exchange is written to the audit trail. Safe to send twice (`Idempotency-Key` is the command id). A command for a closed day goes into the day open now.
        Refusals: `EXCHANGE_MISMATCH` (not worth the same), `EXCHANGE_SAME_NOTE`, `VALIDATION_FAILED`, `NOT_FOUND`, `TRANSACTION_VOID`, `DAY_CLOSED`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '201': { description: Recorded, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
        '422': { $ref: '#/components/responses/Error' }
  /transactions/to-pay:
    get:
      tags: [Transactions]
      summary: Purchases waiting to be paid out (two-step payout)
      description: |
        Newest first, for one branch. `q` matches the receipt number, the customer's name or phone. Each item is the full purchase; `payout.stage` is `to_pay`,
        `payout.cashDue` is the cash still to hand over and `payout.suggestedLines` the notes the recorder suggested. Needs `transactions:read` at the branch.
      parameters:
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: q, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: The purchases, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { type: object } } } } } } }
  /transactions/{id}/pay:
    post:
      tags: [Transactions]
      summary: Pay out the cash of a purchase (two-step payout)
      description: |
        Body: `lines` (the notes handed over), optional `capturedAt` (when it happened, for payments made offline), optional `checkAmount` (the amount worked out from the
        weights; required when the company's `payout.blindCheck` setting is on). The notes must add up to exactly `payout.cashDue`: only the notes can change, never the amount.
        Needs `days:manage` at the branch and an open day. The first payment wins; the same payment sent again is a replay (200).
        Refusals: `PAYOUT_MISMATCH`, `ALREADY_PAID` (names who paid and when), `SAME_PERSON` (when the company requires someone else to pay), `NO_OPEN_DAY`,
        `CHECK_REQUIRED`, `CHECK_MISMATCH`, `TRANSACTION_VOID`, `NOT_FOUND`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Paid, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /settings:
    get:
      tags: [Settings]
      summary: The company's settings (every key, defaults filled in)
      description: |
        Keys: `payout.twoStep`, `payout.sameUserMayPay`, `payout.blindCheck`, `count.blind` (open and close counts are made without showing the books), `customers.autoCreate` (a purchase with a new name and phone adds the customer; default on), `allowance.perPerson`, `receipt.printer`, `receipt.paper`, `receipt.businessName`,
        `receipt.tagline`, `receipt.address`, `receipt.phone`, `receipt.footer`. Any signed-in person may read them.
      responses:
        '200': { description: The settings, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
    put:
      tags: [Settings]
      summary: Change settings
      description: Send only the keys to change. Needs `settings:manage`. Unknown keys and wrong types are refused (`VALIDATION_FAILED`). Written to the audit trail.
      responses:
        '200': { description: The settings after the change, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
        '403': { $ref: '#/components/responses/Error' }
  /search:
    get:
      tags: [Search]
      summary: Global search across everything the caller may see
      description: |
        `q` (2 to 80 characters). Every word must be found, in any order and any case. Phone numbers are compared by their digits
        (`0244 123 456`, `+233244123456` and `244-123-456` are the same). A number is also tried as an amount. Customers are also found
        when the name is slightly misspelt (`close: true`). Returns `{ q, groups: [ { key, total, items } ] }` with the groups
        `customers`, `purchases`, `debts`, `held`, `transfers`, `payments`, `users`, `branches`, `guide`, each only when the caller's
        permissions allow it and only for the branches they work in; groups with nothing found are left out. Each group returns its best 5
        and how many there are in all. `group=<key>` asks for more of one group (`limit` up to 50, default 25); asking for a group the
        caller may not search is refused (403). Fewer than 2 characters returns no groups.
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: group, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        '200': { description: The groups found, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
        '403': { $ref: '#/components/responses/Error' }
  /accounts/live:
    get:
      tags: [Days]
      summary: The closing account as it stands now ("if I closed now")
      description: |
        For one branch the caller works in: the debtors, cash (bundles of 100 notes and loose notes only when every note count is sound, otherwise just the
        amount), goods in stock (the amount, with the purchases since goods were last sent out, each with top, down and value, and any amount brought
        forward), what is owed to customers, and the closing balance (cash + debts + goods - owed to customers). Needs `days:read`. Read-only.
      parameters:
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The account, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
        '403': { $ref: '#/components/responses/Error' }
  /accounts/daily:
    get:
      tags: [Days]
      summary: The daily account (the closed day on one page)
      description: |
        For one date, each branch the caller may see: `status` is `closed`, `open` (a day exists but is not closed) or `none`. A closed branch has the debtors
        (with the change since the previous closed day), cash as bundles (whole hundreds of notes) and loose notes, debts, goods (the days since goods were last
        sent out, the amount brought forward, and the transfers sent earlier), what is owed to customers, the office allowance paid from the drawer, the closing
        balance (cash + debts + goods - owed to customers) and its change since the previous closed day. When a day was opened again after closing, the last session is used.
        Needs `days:read`. `branchId` narrows to one branch the caller may see. Read-only.
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: branchId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The accounts, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /audit:
    get:
      tags: [Audit]
      summary: The audit trail
      description: |
        Who did what, when and where: purchases and voids, days opened, closed and signed off, drawer movements, transfers, difference cases, debts and held gold,
        mobile payments, prices, and changes to users, customers and branches. It is read live from the original records, newest first by default.
        Needs `audit:read` (directors). People who may see every branch see everything, including company-wide events; anyone else sees only their own branches.
        Returns `{ asOf, total, page, size, items, categories, actors }`: `categories` counts every category for the current search (ignoring the category and action filters,
        so the chips stay useful), `actors` the people behind the current search.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string }, description: Words in the summary, the person, the branch or the details }
        - { name: category, in: query, required: false, schema: { type: string, enum: [purchase, day, cash, transfer, case, debt, payment, price, people, customer, setup] } }
        - { name: action, in: query, required: false, schema: { type: string }, description: 'An exact action, for example day.closed' }
        - { name: actorId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time }, description: Exclusive }
        - { name: minAmount, in: query, required: false, schema: { type: number } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [newest, oldest, amount], default: newest } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { description: A page of events, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /dashboard:
    get:
      tags: [Transactions]
      summary: Figures for the home screen
      description: |
        Today against yesterday, a daily series for the last `days` days (7 to 60, default 14), per-branch figures, payment mix, gold on hand, transfers on the road,
        debts owed to us, cash differences at closing and the caller's own purchases. Only the branches the caller works in are counted; `branchId` narrows to one.
        `tellers`, `topCustomers` and `cashDifferences` are left out unless the caller has `reports:read`. Needs `transactions:read`.
      parameters:
        - { name: branchId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 7, maximum: 60, default: 14 } }
      responses:
        '200': { description: The figures, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
  /transactions/search:
    get:
      tags: [Transactions]
      summary: Purchases with filters, sorting and paging
      description: |
        Needs `transactions:read`. Only branches the caller works in are searched. Dates are `yyyy-MM-dd` in each branch's own calendar.
        `q` matches customer name, phone or receipt number. Returns the page of purchases plus the total count and the total paid for everything that matches.
      parameters:
        - { in: query, name: branchId, schema: { type: string, format: uuid } }
        - { in: query, name: customerId, schema: { type: string, format: uuid } }
        - { in: query, name: q, schema: { type: string, maxLength: 60 } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: status, schema: { type: string, enum: [saved, paid, void] } }
        - { in: query, name: flagged, schema: { type: boolean } }
        - { in: query, name: minAmount, schema: { type: string } }
        - { in: query, name: maxAmount, schema: { type: string } }
        - { in: query, name: sort, schema: { type: string, enum: [newest, oldest, amount_desc, amount_asc], default: newest } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: A page of purchases
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items, total, sumPayable]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
                      total: { type: integer }
                      sumPayable: { type: string }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /transactions:
    get:
      tags: [Transactions]
      summary: Transactions for a branch, newest first
      parameters:
        - in: query
          name: branchId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Transactions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Transaction' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Transactions]
      summary: Save a transaction (idempotent)
      description: |
        The client generates the transaction id and sends it again as `Idempotency-Key`. Sending the same key twice
        returns the stored transaction (200) instead of creating a second one (201), so a retry after a lost
        connection can never double-pay. The server recomputes every figure with the same ExcelV1 rules; if its
        amount differs from `clientAmount` it keeps its own and adds the flag `CALC_MISMATCH`. A transaction
        captured offline is never rejected for being late: it is saved and flagged `OFFLINE_ENTRY`.
        The payout notes are taken out of the drawer at the moment the server processes it. If the branch has no open
        day then, the transaction is still saved and flagged `NO_OPEN_DAY`: the cash still leaves the branch's books
        (they are continuous), but it is not tied to a day, so a manager can review it.

        Payment can be split (`payout.split`). The cash part is `payable` minus the split parts and must be handed over
        as `payout.lines`. Parts: `mobile_money` (another branch sends it; stays `pending` until someone at that branch
        confirms), `owed` (the branch now owes the customer; needs customer name and phone) and `debt_offset` (the gold
        settles a debt that customer owes this branch). Header `Idempotency-Key` is optional; when sent it must equal `id`.
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, format: uuid }
        - in: header
          name: X-Client-Time
          schema: { type: string, format: date-time }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransactionRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionResponse' }
        '200':
          description: Already saved (idempotent replay)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionResponse' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /transactions/{id}/payments/{paymentId}/confirm:
    post:
      tags: [Transactions]
      summary: The mobile money arrived
      description: Needs `payments:confirm`, and the person must work at the branch that sent the money (`403 FORBIDDEN` otherwise).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: paymentId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The updated transaction, content: { application/json: { schema: { $ref: '#/components/schemas/TransactionResponse' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: 'ALREADY_RESOLVED or NOT_MOBILE_MONEY', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /transactions/{id}/payments/{paymentId}/fail:
    post:
      tags: [Transactions]
      summary: The mobile money did not arrive
      description: |
        Same permission rules as confirm. The failed amount has to be covered another way, in the same call: `cashReplacements`
        (notes, taken from the drawer of the branch that holds the customer) and/or `replacements` (other split parts).
        Together they must equal the failed amount, else `PAYOUT_MISMATCH`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: paymentId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolvePaymentRequest' }
      responses:
        '200': { description: The updated transaction, content: { application/json: { schema: { $ref: '#/components/schemas/TransactionResponse' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /transactions/{id}:
    get:
      tags: [Transactions]
      summary: One transaction
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionResponse' }
        '404': { $ref: '#/components/responses/Error' }
  /transactions/{id}/cancel:
    post:
      tags: [Transactions]
      summary: Cancel a purchase saved by mistake (B56)
      description: |
        Needs `transactions:cancel`. Reverses every ledger entry of the purchase in the branch's open day (cash returns to
        the drawer open today), takes the gold out of stock, writes off any debt it issued, reopens debts it settled with
        gold and puts collateral it converted back on hold. The purchase stays as `void` with its receipt number.
        Refused with `GOODS_MOVED` when any piece has left the branch, `MONEY_SENT` when mobile money was confirmed,
        `NO_OPEN_DAY`, `ALREADY_CANCELLED`, `NOT_FOUND`, `VALIDATION_FAILED` (reason under 5 characters).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object }
                  entriesReversed: { type: integer }
                  cashBack: { type: number }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /dashboard/performance:
    get:
      tags: [Transactions]
      summary: Each branch's purchases over time, for the performance chart (B58)
      description: |
        Needs `transactions:read`. One series per branch the caller works in (or the `branchIds` asked for, all of which must be
        theirs), in branch-code order so each keeps its colour. `grain` is `day` up to 31 days, `week` (Mondays) up to 182, `month`
        beyond; `buckets` is the shared x axis and every branch has one point per bucket. Each branch also carries `total`,
        `previous` (the same length of time before) and `best`. Cancelled purchases never count.
      parameters:
        - { in: query, name: branchIds, schema: { type: string }, description: Comma-separated branch ids; empty means all the caller's branches. }
        - { in: query, name: days, schema: { type: integer, minimum: 7, maximum: 366, default: 30 } }
      responses:
        '200':
          description: The series
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      asOf: { type: string, format: date-time }
                      days: { type: integer }
                      grain: { type: string, enum: [day, week, month] }
                      from: { type: string, format: date }
                      to: { type: string, format: date }
                      buckets: { type: array, items: { type: string, format: date } }
                      branches:
                        type: array
                        items:
                          type: object
                          properties:
                            branchId: { type: string, format: uuid }
                            name: { type: string }
                            code: { type: string }
                            points: { type: array, items: { type: object, properties: { date: { type: string }, count: { type: integer }, paid: { type: string }, pounds: { type: string }, top: { type: string } } } }
                            total: { type: object }
                            previous: { type: object }
                            best: { type: object, nullable: true }
        '403': { $ref: '#/components/responses/Error' }
  /days/current:
    get:
      tags: [Cash drawer]
      summary: The branch's current day with its drawer balance
      description: |
        Returns the open day if there is one, otherwise the most recent day (closed) or `day: null` if the branch never
        opened one. `balance` is what the drawer should hold according to the server (opening + top-ups - withdrawals -
        payouts applied to this day). `appliedIds` lists the ids of the commands already included, so a device that still
        holds some of them in its offline queue does not subtract them twice. `books` (B52) is what the books hold besides cash
        (`goodsTop`, `goodsDown`, `goodsValue`, `debt`, `payable`, `custodyTop`); devices keep it to work out a closing with no connection. Needs `days:read`.
      parameters:
        - in: query
          name: branchId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Day state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DayState' }
        '403': { $ref: '#/components/responses/Error' }
  /days:
    get:
      tags: [Cash drawer]
      summary: Day history for a branch, newest first
      description: |
        Each day comes with its closing (figures, wording accepted, sign-off) once closed. Filter by date range with
        `from` and `to` (yyyy-MM-dd) and by sign-off status, for example `signoff=pending` for a manager's to-do list.
        Needs `days:read`.
      parameters:
        - { in: query, name: branchId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: signoff, schema: { type: string, enum: [not_required, pending, approved, rejected] } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 60 } }
      responses:
        '200': { description: Days, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Day' } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /days/{id}:
    get:
      tags: [Cash drawer]
      summary: One day
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The day, content: { application/json: { schema: { $ref: '#/components/schemas/DayResponse' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /days/{id}/activity:
    get:
      tags: [Cash drawer]
      summary: What happened on this one day ("This day only")
      description: |
        The day's own movements, apart from the running totals since go-live: the opening count, notes in, out and net per
        denomination, the change in goods held, and the people lent to or repaid that day (`debts.debtors`, each with
        `issued`, `repaid`, `net`; `debts.net` is their sum). Opening balances are not counted as activity. Entries made
        after a day closed (late sync) belong to no day. Works for open and closed days. Needs `days:read`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The day's activity, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
        '404': { $ref: '#/components/responses/Error' }
  /days/{id}/closing-preview:
    get:
      tags: [Cash drawer]
      summary: What the books say the branch holds now, and the wording to accept before closing
      description: |
        Use it to prefill the closing screen. The teller still counts and weighs; whatever they report that differs from
        `expected` needs a written reason. `pendingPayments` is the number of mobile-money parts still unconfirmed
        (they do not stop the day from closing). Needs `days:manage`. `409 DAY_ALREADY_CLOSED` once closed.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Preview, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/ClosingPreview' } } } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /days/open:
    post:
      tags: [Cash drawer]
      summary: Open the day with a counted opening balance (idempotent)
      description: |
        The client chooses the day id (`id`) and repeats it as `Idempotency-Key`. One open day per branch and one day per
        branch per `businessDate`. The first day a branch ever opens sets its starting balance. After that, the count is
        compared with what the books say should be in the drawer: if it differs, `explanation` (at least 5 characters)
        is required (`422 EXPLANATION_REQUIRED`), the difference is recorded as an opening adjustment, and the day is
        flagged `OPENING_DIFFERS`. With `source: carried` the books' own figures are used as the count.
        A command captured offline is flagged `OFFLINE_ENTRY`. Needs `days:manage`.
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenDayRequest' }
      responses:
        '201': { description: Opened, content: { application/json: { schema: { $ref: '#/components/schemas/DayResponse' } } } }
        '200': { description: Already opened with this id (replay), content: { application/json: { schema: { $ref: '#/components/schemas/DayResponse' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /days/{id}/close:
    post:
      tags: [Cash drawer]
      summary: Close the day with the reported figures and the confirmation (idempotent)
      description: |
        The teller reports seven figures: the notes in the drawer, total top weight, total down weight, value of goods,
        debts owed to the branch, amounts the branch owes, and top weight of unrefined gold held as security.
        The server compares each with the books. **Every figure that differs needs its own written reason** in
        `explanations` (at least 5 characters; keys `cash`, `goods_top`, `goods_down`, `goods_value`, `debt`, `payable`,
        `custody_top`), or the whole closing is refused with `422 EXPLANATION_REQUIRED` naming them. Cash also counts a
        different mix of notes of the same value as a difference.

        `confirmation.accepted` must be true and `confirmation.version` the current one from the preview
        (`422 CONFIRMATION_REQUIRED`, `409 CONFIRMATION_OUTDATED`). The wording is stored on the day.

        On success the books are adjusted to match the report (as new ledger rows; nothing is edited), one case is opened
        for review for every real difference, and the day waits for a manager's sign-off if anything differed. A
        pending sign-off never stops the next day from opening. A command sent again with the same id returns the closed
        day (200); a different command for a closed day is `409 DAY_ALREADY_CLOSED`. Needs `days:manage`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Idempotency-Key, required: false, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseDayRequest' }
      responses:
        '201': { description: Closed, content: { application/json: { schema: { $ref: '#/components/schemas/DayResponse' } } } }
        '200': { description: Already closed by this command (replay), content: { application/json: { schema: { $ref: '#/components/schemas/DayResponse' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /days/{id}/movements:
    post:
      tags: [Cash drawer]
      summary: Record cash put into or taken out of the drawer (idempotent)
      description: Needs `days:manage`. The day must be open (`409 DAY_CLOSED` otherwise).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovementRequest' }
      responses:
        '201': { description: Recorded, content: { application/json: { schema: { $ref: '#/components/schemas/MovementResponse' } } } }
        '200': { description: Already recorded (replay), content: { application/json: { schema: { $ref: '#/components/schemas/MovementResponse' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /days/{id}/signoff:
    post:
      tags: [Cash drawer]
      summary: A manager approves or rejects a closing difference
      description: |
        Needs `days:signoff` for that branch. The person who closed the day cannot sign it off (`403 SELF_SIGNOFF`).
        Rejecting needs a reason. This records the decision only: the books and the review cases are not changed here.
        `409 NOTHING_TO_SIGN` when the day has no pending difference.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignoffRequest' }
      responses:
        '200': { description: Signed off, content: { application/json: { schema: { $ref: '#/components/schemas/DayResponse' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /payments/pending:
    get:
      tags: [Transactions]
      summary: Mobile money waiting to be confirmed
      description: |
        `role=sending` (default): money this branch was asked to send and has not confirmed or failed yet. Needs
        `payments:confirm`. `role=receiving`: money other branches still owe for purchases made at this branch. Needs
        `transactions:read`.
      parameters:
        - { in: query, name: branchId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: role, schema: { type: string, enum: [sending, receiving], default: sending } }
      responses:
        '200':
          description: Pending parts, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        paymentId: { type: string, format: uuid }
                        transactionId: { type: string, format: uuid }
                        reference: { type: string }
                        purchaseBranchId: { type: string, format: uuid }
                        purchaseBranchName: { type: string }
                        sendingBranchId: { type: string, format: uuid }
                        sendingBranchName: { type: string }
                        customerName: { type: string }
                        amount: { type: string }
                        externalRef: { type: string, nullable: true }
                        createdAt: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Error' }
  /customers:
    get:
      tags: [Customers and debts]
      summary: Find customers by name or phone, this branch's first
      description: |
        With `branchId`, customers who have sold at that branch come first (most recent first), then the rest of the company; an exact phone match always leads.
        Each row says `atBranch`. With no `q` and a large `limit` (up to 1000) it returns the branch's directory, which the app keeps on the device so the
        customer picker works offline.
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: branchId, schema: { type: string, format: uuid } }
        - { in: query, name: limit, schema: { type: integer, default: 25, maximum: 1000 } }
      responses:
        '200': { description: Customers, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Customer' } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
  /users:
    get:
      tags: [People]
      summary: All users of the company
      description: Needs `users:manage`. Switched-off users are included and listed last.
      responses:
        '200': { description: Users, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/ManagedUser' } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [People]
      summary: Add a user
      description: |
        Needs `users:manage`. The password is temporary (at least 10 characters): the person must choose their own at the first
        sign-in. A person needs at least one branch unless their role has `branches:all`. `overrides` are personal grants
        (`allow`) or denials (`deny`) on top of the role. Replays by `id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, username, displayName, password, roleKey]
              properties:
                id: { type: string, format: uuid }
                username: { type: string }
                displayName: { type: string }
                email: { type: string, nullable: true }
                phone: { type: string, nullable: true }
                password: { type: string, minLength: 10 }
                roleKey: { type: string }
                branchIds: { type: array, items: { type: string, format: uuid } }
                overrides: { type: array, items: { $ref: '#/components/schemas/PermissionOverride' } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/ManagedUser' } } } } } }
        '200': { description: Replayed }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /users/{id}:
    patch:
      tags: [People]
      summary: Change a user
      description: |
        Needs `users:manage`. Send only what changes: `displayName`, `email`, `phone`, `roleKey`, `branchIds` (replaces the set),
        `overrides` (replaces the set), `isActive`. People are switched off, never deleted. Changing role, branches, overrides or
        `isActive` signs the person out. You cannot change your own role, branches, overrides or `isActive`
        (`CANNOT_CHANGE_OWN_ACCESS`), and the company always keeps someone who can manage users (`LAST_DIRECTOR`).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The user, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/ManagedUser' } } } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /users/{id}/password:
    post:
      tags: [People]
      summary: Set a temporary password
      description: Needs `users:manage`. The person must choose their own at the next sign-in and is signed out everywhere. Not for your own account.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [password], properties: { password: { type: string, minLength: 10 } } }
      responses:
        '200': { description: The user, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/ManagedUser' } } } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /roles:
    get:
      tags: [People]
      summary: Roles and what each allows
      description: Each role with its permissions, how many active people hold it (`activeMembers`) and who they are (`members`). Needs `users:manage`.
      responses:
        '200': { description: Roles, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { type: object, properties: { key: { type: string }, name: { type: string }, isSystem: { type: boolean }, permissions: { type: array, items: { type: string } } } } } } } } } }
    post:
      tags: [People]
      summary: Create a custom role
      description: |
        Body `{ id, name, description?, permissions: [...] }` (`id` is a new uuid and must equal `Idempotency-Key`). `permissions` are names the system knows, at least one.
        The role key is made from the name. Needs `users:manage`. Errors: `ROLE_EXISTS` (409), `VALIDATION_FAILED` (422).
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
        '200': { description: Already created (same id) }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /roles/{key}:
    patch:
      tags: [People]
      summary: Rename a custom role or change what it allows
      description: |
        Body with any of `name`, `description`, `permissions`. The standard roles (director, manager, teller) cannot be changed (`SYSTEM_ROLE`, 409): copy one instead.
        Changing `permissions` signs out everyone who holds the role, and is refused (`LAST_DIRECTOR`, 409) if nobody active would be left who can manage users.
        Needs `users:manage`. Written to the audit trail with before and after.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The role, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [People]
      summary: Delete a custom role nobody holds
      description: Refused while anyone (active or not) holds it (`ROLE_IN_USE`, 409) and for the standard roles (`SYSTEM_ROLE`, 409). Needs `users:manage`.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Error' }
  /me/security:
    get:
      tags: [People]
      summary: Does the signed-in person have to choose a new password
      responses:
        '200': { description: State, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { mustChangePassword: { type: boolean } } } } } } } }
  /me/password:
    post:
      tags: [People]
      summary: Change my own password
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [currentPassword, newPassword], properties: { currentPassword: { type: string }, newPassword: { type: string, minLength: 10 } } }
      responses:
        '204': { description: Changed }
        '422': { $ref: '#/components/responses/Error' }
  /customers/list:
    get:
      tags: [People]
      summary: Customers, paged
      description: |
        Needs `customers:read`. Each row has purchase count (cancelled purchases left out), lifetime paid, first and last purchase, and what the customer owes or is owed.
        `filter`: all, owes_us, we_owe, active (bought in the last 30 days), inactive (nothing in 90 days, or never). `sort`: name, recent, purchases, paid, owes.
        The response also has `summary` { customers, active, owesUs, weOwe } for the whole company, whatever the search and filter.
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: filter, schema: { type: string, enum: [all, owes_us, we_owe, active, inactive], default: all } }
        - { in: query, name: sort, schema: { type: string, enum: [name, recent, purchases, paid, owes], default: name } }
        - { in: query, name: limit, schema: { type: integer, default: 25, maximum: 100 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        '200': { description: A page, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { total: { type: integer }, items: { type: array, items: { $ref: '#/components/schemas/CustomerRow' } } } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
  /customers/{id}:
    get:
      tags: [People]
      summary: One customer with purchases, debts and held gold
      description: Needs `customers:read`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The customer, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/CustomerDetail' } } } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [People]
      summary: Edit a customer
      description: |
        Needs `customers:manage`. Send only what changes (`name`, `phone`, `notes`). Debts follow the new name, receipts keep the
        name used on the day. A name and phone already used by another customer gives `DUPLICATE_CUSTOMER`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The customer, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/CustomerDetail' } } } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /customers/{id}/merge:
    post:
      tags: [People]
      summary: Merge a duplicate into this customer
      description: Needs `customers:manage`. Purchases, debts and held gold of `removeId` move to this customer and the duplicate is removed (kept in the audit trail).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [removeId], properties: { removeId: { type: string, format: uuid } } }
      responses:
        '200': { description: The kept customer, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/CustomerDetail' } } } } } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /branches/manage:
    get:
      tags: [People]
      summary: All branches, including switched-off ones
      description: Needs `branches:manage`. `GET /branches` stays the list of branches the caller works in.
      responses:
        '200': { description: Branches, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/ManagedBranch' } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
  /branches/{id}:
    patch:
      tags: [People]
      summary: Rename a branch, change its time zone, or switch it on or off
      description: Needs `branches:manage`. The main branch cannot be switched off (`MAIN_BRANCH`) and a branch with an open day cannot either (`DAY_OPEN`).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The branch, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/ManagedBranch' } } } } } }
        '409': { $ref: '#/components/responses/Error' }
  /notifications:
    get:
      tags: [Notifications]
      summary: The signed-in person's own notifications
      description: |
        `{ unread, items[] }`, newest first. Created by the database when something needs a person (a transfer on the way, a difference
        to review, a closing to sign off, mobile money to send, a margin to approve, a price update). Everyone signed in has an inbox.
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { in: query, name: unreadOnly, schema: { type: boolean } }
      responses:
        '200': { description: The inbox, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
  /notifications/read:
    post:
      tags: [Notifications]
      summary: Mark notifications read
      description: |
        Body `{ ids: [...] }` marks those read, `{ all: true }` marks every unread one of the caller's. Returns the updated inbox.
      responses:
        '200': { description: The inbox, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
        '422': { $ref: '#/components/responses/Error' }
  /notifications/hub-short:
    post:
      tags: [Notifications]
      summary: Report that the branch hub found an entry short
      description: |
        Body `{ branchId, commandId, short: { "<note value>": <count> }, capturedAt? }`. Sent by a computer when the branch hub recorded one of its entries
        but the drawer did not hold enough notes for it. Records it once per `commandId` (a repeat returns `recorded: false`) and notifies the people who may
        review differences at that branch. Changes no entry or balance. Needs a permission to save purchases or drawer entries and a branch the caller works in.
      responses:
        '200': { description: "`{ recorded, value? }`", content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /imports/history:
    post:
      tags: [Imports]
      summary: Import past purchases (records only)
      description: |
        Body `{ batchId, label?, rows: [ { key, branchId, capturedAt, customerName, customerPhone?, receiptNo?, note?, items: [ { label?, top, down, price } ], amountPaid?, sheetAmount? } ] }`,
        1 to 500 rows. The server recalculates every item with the company's formula; `sheetAmount` is only compared (a difference of GH₵ 1 or more adds the
        `CALC_MISMATCH` flag). `amountPaid` defaults to the calculated amount, truncated. Purchases are stored as `HISTORICAL` records numbered `<BRANCH>-H<yyyymmdd>-<n>`:
        no payments, no ledger entries, and their gold is marked `historical` so it can never be transferred. Safe to resend: a row already imported under the same
        `batchId` and `key` is skipped. Returns `{ created, skipped, rows }`. Needs `imports:manage`.
      responses:
        '200': { description: Result, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
        '422': { $ref: '#/components/responses/Error' }
  /price-feed:
    get:
      tags: [PriceFeed]
      summary: Automatic price settings, the price in use and recent activity
      description: Needs `prices:approve`. `events` are the latest 20 results (`applied`, `held` waiting for a director, `failed`).
      responses:
        '200': { description: Settings and history, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
    put:
      tags: [PriceFeed]
      summary: Save the settings
      description: |
        Body `{ enabled, windows: [{start:"HH:MM", end:"HH:MM", everyMinutes}], weekdays: [1..7 ISO], timezone, marginPolicy: approve|carry, maxJumpPct }`.
        Inside a window the server looks every `everyMinutes` and stops for that window once a new price is captured. The automatic price is recorded under
        the person who saved the settings. `marginPolicy: approve` carries each branch's margin onto the new price as provisional and notifies approvers.
      responses:
        '200': { description: Saved, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
        '422': { $ref: '#/components/responses/Error' }
  /price-feed/preview:
    post:
      tags: [PriceFeed]
      summary: Read GoldBod's page and say what was found, recording nothing
      responses:
        '200': { description: "`{ found, message, price?, excerpt? }`", content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
  /price-feed/check:
    post:
      tags: [PriceFeed]
      summary: Look now and record the result as if the schedule had fired
      responses:
        '200': { description: The result, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
  /price-feed/events/{id}/accept:
    post:
      tags: [PriceFeed]
      summary: Use a held price
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Updated settings and history, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
        '409': { $ref: '#/components/responses/Error' }
  /price-feed/events/{id}/dismiss:
    post:
      tags: [PriceFeed]
      summary: Dismiss a held price
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Updated settings and history, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
  /imports/opening:
    post:
      tags: [Imports]
      summary: Load opening gold and debts for go-live
      description: |
        Body `{ batchId, label?, asOf, rows: [ {kind:"goods", branchId, top, down, value, note?} | {kind:"debt", branchId, partyName, partyType?, phone?, amount, issuedAt?, dueDate?, reason?} ] }`.
        Applied whole or not at all. One opening gold line per branch (`ALREADY_SET` otherwise). Debts are ordinary receivable debts and can be repaid normally.
        Cash is not loaded here: it is the first count at the branch's first open day. Resending a `batchId` changes nothing (`alreadyApplied: true`). Needs `imports:manage`.
      responses:
        '200': { description: Result, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /imports/customers:
    post:
      tags: [Imports]
      summary: Import customers
      description: |
        Body `{ rows: [ { name, phone, notes? } ] }`, 1 to 1000 rows. A customer with the same name and phone already there is left alone. Returns `{ created, existing }`. Needs `imports:manage`.
      responses:
        '200': { description: Result, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
        '422': { $ref: '#/components/responses/Error' }
  /imports:
    get:
      tags: [Imports]
      summary: Earlier purchase imports
      responses:
        '200': { description: Batches, newest first, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { type: object } } } } } } }
  /imports/{id}/undo:
    post:
      tags: [Imports]
      summary: Undo an import
      description: |
        Body `{ reason }` (5+ characters). Purchases imports: voids every purchase with the reason. Opening-balance imports: posts reversing ledger entries and writes the debts off (refused with `ALREADY_IN_USE` once a debt from it was repaid). Closes the batch. Nothing is deleted. Needs `imports:manage`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Number voided, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
        '409': { $ref: '#/components/responses/Error' }
  /discrepancies:
    get:
      tags: [Review]
      summary: The inbox of difference cases
      description: |
        Differences found when opening or closing a day or receiving a transfer. `status` is `active` (open and being looked at, the
        default), `all`, or one of `open`, `under_review`, `resolved`, `written_off`. Only branches the caller works in. Needs `discrepancies:review`.
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: branchId, schema: { type: string, format: uuid } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 300 } }
      responses:
        '200': { description: Cases, newest first, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { type: object } } } } } } }
  /discrepancies/{id}:
    get:
      tags: [Review]
      summary: One case with its full history
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The case and its `actions`, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
        '404': { $ref: '#/components/responses/Error' }
  /discrepancies/{id}/actions:
    post:
      tags: [Review]
      summary: Take, note, resolve or reopen a case
      description: |
        Body `{ action: take | note | resolve | reopen, note?, resolutionType?, summary? }`. `resolve` needs `resolutionType`
        (explained, found, recovered, corrected_entry, written_off) and a `summary` of at least 10 characters; `reopen` needs a `note`.
        The recorded facts of a case never change and nothing is posted to the books: closing already adjusted them.
        `409 CASE_CLOSED` / `CASE_NOT_CLOSED` when the case is in the wrong state. Needs `discrepancies:review`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The case after the action, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /branches/{id}/timeline:
    get:
      tags: [Review]
      summary: Every movement of one branch, newest first, with the balance after each
      description: |
        Filter by `from` / `to` (when it happened) and `asset` (cash, goods, debt, payable). Page by passing the previous page's
        `nextBefore` as `before`; `nextBefore` is null on the last page. Needs `reports:read` and a branch the caller works in.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
        - { in: query, name: asset, schema: { type: string } }
        - { in: query, name: before, schema: { type: integer, format: int64 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 300 } }
      responses:
        '200': { description: '`{ entries, nextBefore }`', content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
  /branches/{id}/transactions/export:
    get:
      tags: [Review]
      summary: Flat purchase rows for a spreadsheet
      description: Up to 5000 purchases of the branch in the range (`from` inclusive, `to` exclusive), oldest first, each with how it was paid (cash, mobile money, owed). `truncated` says more exist. Needs `reports:read` and the branch.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        '200': { description: "`{ truncated, rows }`", content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
  /branches/position:
    get:
      tags: [Review]
      summary: What branches have sent to, or paid for, each other
      description: Per sender and receiver pair, since the beginning, for pairs involving a branch the caller works in. Needs `reports:read`.
      responses:
        '200': { description: Pairs, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { type: object } } } } } } }
  /transfers:
    get:
      tags: [Transfers]
      summary: Transfers that start or end at a branch
      description: Needs `transfers:read`. `direction` is `outgoing` (this branch sends), `incoming` (this branch receives) or `all`.
      parameters:
        - { in: query, name: branchId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string, enum: [draft, released, received, received_with_discrepancy, cancelled] } }
        - { in: query, name: direction, schema: { type: string, enum: [all, outgoing, incoming], default: all } }
      responses:
        '200': { description: Rows without the timeline, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/TransferRow' } } } } } } }
    post:
      tags: [Transfers]
      summary: Start a transfer (draft)
      description: |
        Needs `transfers:create` and that the caller works at `originBranchId`. `Idempotency-Key` must equal `id`.
        `kind` is `goods` (pass `itemIds`, pieces on hand at the sending branch) or `cash`. `collector` is optional here and can be set later:
        `{type: staff, userId}` or `{type: external, name, phone, idType, idNumber, relationship}`.
      responses:
        '201': { description: The draft, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Transfer' } } } } } }
        '409': { $ref: '#/components/responses/Error' }
  /transfers/available-items:
    get:
      tags: [Transfers]
      summary: Gold at a branch that can be put on a transfer
      description: On hand at the branch and not on another open transfer. `value` is the piece's booked value. Needs `transfers:create`.
      parameters:
        - { in: query, name: branchId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Pieces, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/TransferableItem' } } } } } } }
  /transfers/staff:
    get:
      tags: [Transfers]
      summary: Active staff who can carry a transfer
      description: Needs `transfers:create`. Lets a sender pick a collector without being able to manage users.
      responses:
        '200': { description: Staff, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, displayName: { type: string } } } } } } } } }
  /transfers/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Transfers]
      summary: One transfer with its lines, payments, cases and full timeline
      description: Visible to people who work at either end. Needs `transfers:read`.
      responses:
        '200': { description: The transfer, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Transfer' } } } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Transfers]
      summary: Change a draft (add or remove goods, purpose, expected arrival) or the collector
      description: A draft can change anything below; a released transfer can only change `collector` (the change is recorded in the timeline). Needs `transfers:create` at the sending branch.
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { addItemIds: { type: array, items: { type: string, format: uuid } }, removeLineIds: { type: array, items: { type: string, format: uuid } }, collector: { type: object }, purpose: { type: string }, purposeNote: { type: string }, method: { type: string }, expectedArrivalAt: { type: string, format: date-time } } }
      responses:
        '200': { description: The transfer, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Transfer' } } } } } }
        '409': { $ref: '#/components/responses/Error' }
  /transfers/{id}/release:
    post:
      tags: [Transfers]
      summary: Hand the transfer to the collector
      description: |
        Goods leave the sending branch's books (or, for cash, the notes in `lines` leave its drawer) and the totals are frozen. Needs a collector and an
        open day at the sending branch (`COLLECTOR_REQUIRED`, `DAY_NOT_OPEN`, `NO_GOODS`).
        Goods transfers may carry `scaledTop` and `scaledDown` (B57): the sender's scale reading for all the pieces together. It is always recorded; the transfer
        then returns `scaled` with the differences from the books and a grade (`ok`, `notice`, `alert`, `critical`). `critical` also notifies the branch's reviewers.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { note: { type: string }, collectedAt: { type: string, format: date-time }, scaledTop: { type: string }, scaledDown: { type: string }, lines: { type: object, description: 'Cash transfers only: notes sent, {"100": 10}.' } } }
      responses:
        '200': { description: The transfer, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Transfer' } } } } } }
  /transfers/{id}/payments:
    post:
      tags: [Transfers]
      summary: Record money that changed hands because of the transfer
      description: |
        `direction` is `paid_to_collector` or `received_from_collector`. `branchId` is the end that made or received the payment. Cash needs `lines`
        that add up to `amount` and an open day at that branch. Allowed once the transfer is released.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [branchId, direction, amount, purpose], properties: { id: { type: string, format: uuid }, branchId: { type: string, format: uuid }, direction: { type: string, enum: [paid_to_collector, received_from_collector] }, amount: { type: string }, method: { type: string, enum: [cash, mobile_money, bank, other] }, purpose: { type: string }, externalRef: { type: string }, note: { type: string }, lines: { type: object } } }
      responses:
        '200': { description: The transfer, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Transfer' } } } } } }
  /transfers/{id}/receive:
    post:
      tags: [Transfers]
      summary: Receive at the destination, confirming each line
      description: |
        Needs `transfers:receive` and an open day at the receiving branch. Goods: every line must be given as `matched`, `differs` (with the weights found)
        or `missing`; a line that differs or is missing needs a note and opens a discrepancy case. What is received is booked on the receiving branch
        as stock. Cash: `lines` are the notes counted (`{}` for an empty envelope); a different total needs `note` and opens a case.
        Refusals: `NOT_IN_TRANSIT`, `LINES_MISSING`, `EXPLANATION_REQUIRED`, `DAY_NOT_OPEN`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { note: { type: string }, lines: { description: 'Goods: array of {lineId, outcome, top, down, note}. Cash: notes counted.' } } }
      responses:
        '200': { description: The transfer, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Transfer' } } } } } }
  /transfers/{id}/cancel:
    post:
      tags: [Transfers]
      summary: Cancel a draft
      description: Only a draft can be cancelled (`TRANSFER_LOCKED`). Needs a reason.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } }
      responses:
        '200': { description: The transfer, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Transfer' } } } } } }
  /transfers/{id}/recall:
    post:
      tags: [Transfers]
      summary: Recall a released transfer that never arrived
      description: |
        Sending branch only, while the transfer is still `released`. The goods or notes that left are put back into the sending
        branch's books (new ledger entries, nothing edited), the pieces go back on the shelf, the transfer is closed as `cancelled`
        with the reason, and the receiving branch is told not to accept it. Needs an open day at the sending branch
        (`DAY_NOT_OPEN`). A draft is cancelled instead (`TRANSFER_NOT_RELEASED`); a received or already closed transfer cannot be
        recalled (`TRANSFER_NOT_IN_TRANSIT`).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } }
      responses:
        '200': { description: The transfer, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Transfer' } } } } } }
  /transfers/{id}/notes:
    post:
      tags: [Transfers]
      summary: Add a note to the timeline
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string } } } } }
      responses:
        '200': { description: The transfer, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Transfer' } } } } } }
  /attachments:
    post:
      tags: [Photos]
      summary: Send a photo
      description: |
        One multipart request: `file` (the photo, JPEG, up to 8 MB), `thumb` (its small preview, JPEG, up to 512 KB, optional) and `meta` (JSON text:
        `id` (chosen by the phone, so sending twice stores it once), `entityType` (`transfer` or `user`), `entityId`, `slot` (`release`, `receive`, `other`; `profile` for a person),
        `fileName`, `width`, `height`, `takenAt`, `source` (`camera`, `native`, `library`), `stamped`). A transfer photo needs `transfers:create` or `transfers:receive` and a
        branch on that transfer; a profile photo is always your own. 201 when stored, 200 when that id was already stored. No photo is ever required by any other call.
      requestBody:
        required: true
        content: { multipart/form-data: { schema: { type: object, required: [file, meta], properties: { file: { type: string, format: binary }, thumb: { type: string, format: binary }, meta: { type: string } } } } }
      responses:
        '201': { description: Stored }
        '200': { description: Already stored (the same photo sent again) }
        '404': { description: The transfer is not one of your branches' }
        '422': { description: Not a JPEG, too big, or not a place for a photo }
    get:
      tags: [Photos]
      summary: The photos of one thing
      description: Oldest first; removed photos are left out. For a transfer, needs `transfers:read` and a branch on the transfer.
      parameters:
        - { in: query, name: entityType, required: true, schema: { type: string, enum: [transfer, user] } }
        - { in: query, name: entityId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Photos, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { type: object } } } } } } }
  /attachments/{id}/file:
    get:
      tags: [Photos]
      summary: The photo itself (JPEG)
      description: Needs the sign-in header, so the app fetches it and shows it from memory. Never changes, so it is cached for a year (ETag too).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The JPEG }
        '404': { description: Not there, removed, or not yours to see }
  /attachments/{id}/thumb:
    get:
      tags: [Photos]
      summary: The small preview of a photo (JPEG, about 320 px)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The JPEG }
        '404': { description: Not there, removed, or not yours to see }
  /attachments/profile/{userId}:
    get:
      tags: [Photos]
      summary: A person's current profile photo
      description: The newest one that has not been removed. Everyone in the company can see it. Kept by the browser for five minutes only, because it can change.
      parameters:
        - { in: path, name: userId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: thumb, schema: { type: boolean, default: true } }
      responses:
        '200': { description: The JPEG }
        '404': { description: This person has no profile photo }
  /attachments/{id}/remove:
    post:
      tags: [Photos]
      summary: Take a photo off the screen
      description: The person who took it, or anyone with `attachments:remove`. The record of the photo, and of who removed it and why, is kept; the transfer's timeline says a photo was removed.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content: { application/json: { schema: { type: object, properties: { reason: { type: string, nullable: true } } } } }
      responses:
        '200': { description: Removed (removing twice is harmless) }
        '403': { description: Not your photo and no `attachments:remove` }
  /exchanges:
    get:
      tags: [Operations]
      summary: Recent note exchanges at a branch
      description: The branch's own exchanges (made without a purchase), newest first, each with the notes that came in, the notes that went out, the value and who made it. Needs `notes:exchange`.
      parameters:
        - { in: query, name: branchId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: limit, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200': { description: Exchanges, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { type: object } } } } } } }
  /sync/devices:
    post:
      tags: [Sync]
      summary: "Register this device's signing key"
      description: "A signed-in person registers the public key (base64 SPKI, ECDSA P-256) of the device they work on, so commands they make offline can be verified later. Registering again replaces the key."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [deviceId, publicKey], properties: { deviceId: { type: string, minLength: 8, maxLength: 80 }, publicKey: { type: string } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
  /sync/commands:
    post:
      tags: [Sync]
      summary: "Send commands made offline (signed batch)"
      description: "Up to 200 commands, applied in order. Each carries id, type (transaction.create, transaction.pay, drawer.movement, drawer.exchange, day.open, day.close), userId (who made it), deviceId, capturedAt, payloadJson (the exact JSON text that was signed) and signature (base64 r||s). The signed text is `gilded-cmd-v1\\n{id}\\n{type}\\n{userId}\\n{deviceId}\\n{capturedAt}\\n{payloadJson}`. Result per command: `applied` (with flags such as offline), `held` or `rejected` (kept for review), or `refused` (not recorded: BAD_COMMAND, BAD_SIGNATURE, UNKNOWN_DEVICE, USER_INACTIVE, FORBIDDEN). Sending a command again returns its recorded result. `day.open` and `day.close` sent this way are counts made with no connection (B51): they are never refused for a missing reason (the difference is recorded, flag `found-at-sync`, and a manager reviews it); an opening for a date already open is merged into that day (flag `merged-into-open-day`); a closing for a day already closed is kept as a second count (flag `second-count`). Their payload may carry `basis` (the figures the device showed) and, for a closing, `confirmation.text` (the wording the person accepted). When an opening or closing is applied the server tries that branch's held commands again by itself (flag `auto-retried`)."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [commands], properties: { commands: { type: array, maxItems: 200, items: { type: object } } } } } } }
      responses:
        '200': { description: Results in the order sent, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { results: { type: array, items: { type: object } } } } } } } } }
  /sync/review:
    get:
      tags: [Sync]
      summary: "Offline entries waiting for review"
      description: "Held (may succeed once something else arrives or is fixed) and rejected (the entry itself is wrong) commands with their full content, plus the last 20 resolved. Needs `sync:review`."
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
  /sync/review/{id}:
    post:
      tags: [Sync]
      summary: "Retry or dismiss an entry"
      description: "`retry` runs it again as the person who made it. `dismiss` needs a note of at least 5 characters. Needs `sync:review`. Both are audited."
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [action], properties: { action: { type: string, enum: [retry, dismiss] }, note: { type: string } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
  /guide:
    get:
      tags: [Guide]
      summary: "The rules and guides (reader)"
      description: "Published articles by category, without content, with whether this person has read each and how many they still have to read. Everyone signed in."
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
  /guide/articles/{id}:
    get:
      tags: [Guide]
      summary: "One article with its content"
      description: "Blocks: heading, text, list (bullets, numbers, dos, donts), callout, image (data URL), flow, divider. `draft=true` previews a draft and needs `guide:manage`."
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
  /guide/articles/{id}/read:
    post:
      tags: [Guide]
      summary: "Say this article has been read"
      description: "Records the current version as read by the caller. Everyone signed in."
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
  /guide/admin:
    get:
      tags: [Guide]
      summary: "Everything, for the writer"
      description: "All articles including drafts with how many have read each, the categories, and the reminder settings. Needs `guide:manage`."
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
  /guide/admin/categories/{id}:
    put:
      tags: [Guide]
      summary: "Create or rename a category"
      description: "Needs `guide:manage`."
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
    delete:
      tags: [Guide]
      summary: "Delete an empty category"
      description: "409 NOT_EMPTY while it has articles. Needs `guide:manage`."
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
  /guide/admin/articles/{id}:
    put:
      tags: [Guide]
      summary: "Create or save an article"
      description: "Saved as a draft (or in place when published). Send `rev` from the last read: an older one is refused with 409 EDIT_CONFLICT. Saving tells nobody. Needs `guide:manage`."
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
    delete:
      tags: [Guide]
      summary: "Delete an article"
      description: "Needs `guide:manage`."
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
  /guide/admin/articles/{id}/publish:
    post:
      tags: [Guide]
      summary: "Publish or republish"
      description: "`notify` (default true) tells every active person; `material: true` on an already published article raises the version so everyone must read it again. Needs `guide:manage`."
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
  /guide/admin/articles/{id}/unpublish:
    post:
      tags: [Guide]
      summary: "Hide an article (back to draft)"
      description: "Needs `guide:manage`."
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
  /guide/admin/articles/{id}/readers:
    get:
      tags: [Guide]
      summary: "Who has read the current version"
      description: "Every active person, unread first. Needs `guide:manage`."
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
  /guide/admin/reminders:
    put:
      tags: [Guide]
      summary: "Set the reminders to read"
      description: "`frequency` off|daily|weekly|monthly, `time` HH:MM in the company timezone, `weekday` 1–7 (weekly), `audience` unread|everyone. A worker sends the reminder notification once a day when due. Needs `guide:manage`."
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } } }
  /expectations:
    get:
      tags: [Operations]
      summary: What carat to expect
      description: |
        For a town and/or a customer: how many pieces this company has bought (cancelled purchases left out), the usual carat (median),
        and the range most pieces fall in (10th to 90th percentile), in tellers' words ("22 high"). `enough` is false below 5 pieces, so
        show only the count. Plain statistics, not a model. Needs `transactions:read`.
      parameters:
        - { in: query, name: townId, schema: { type: string, format: uuid } }
        - { in: query, name: customerId, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Expectations, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { town: { type: object, nullable: true }, customer: { type: object, nullable: true } } } } } } } }
  /towns:
    get:
      tags: [Operations]
      summary: The company's origin towns
      description: Most used first. `q` narrows by name (case, spaces and punctuation ignored). Needs `transactions:read`. The app keeps the whole list on the device.
      parameters:
        - { in: query, name: q, schema: { type: string } }
      responses:
        '200': { description: Towns, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string }, uses: { type: integer } } } } } } } } }
    post:
      tags: [Operations]
      summary: Add a town
      description: Finds the town by name or adds it. An existing name returns the existing town, whatever `id` was sent. Needs `transactions:create`.
      requestBody:
        content: { application/json: { schema: { type: object, required: [name], properties: { id: { type: string, format: uuid }, name: { type: string } } } } }
      responses:
        '200': { description: The town, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string }, uses: { type: integer } } } } } } } }
  /debts:
    get:
      tags: [Customers and debts]
      summary: Debts of a branch
      description: |
        `direction` is `receivable` (owed to the branch, such as loans) or `payable` (the branch owes someone, such as a
        customer still to be paid). Needs `debts:read`.
      parameters:
        - { in: query, name: branchId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: direction, schema: { type: string, enum: [receivable, payable] } }
        - { in: query, name: openOnly, schema: { type: boolean, default: false } }
        - { in: query, name: customerId, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Debts, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Debt' } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
  /debts/{id}:
    get:
      tags: [Customers and debts]
      summary: One debt with its repayments
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The debt, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Debt' } } } } } }
        '404': { $ref: '#/components/responses/Error' }
  /debts/loans:
    post:
      tags: [Customers and debts]
      summary: Give a loan, optionally against unrefined gold (idempotent)
      description: |
        Cash leaves the drawer and a debt is created. With `collateral`, only the top weight of the unrefined gold is
        recorded and the branch keeps it: it is held as security, has no value and is not counted as goods.
        When the customer returns, the gold is refined and bought like any purchase (`POST /transactions` with
        `collateralId`, and a `debt_offset` part); or, once the loan is paid, the gold is handed back
        (`POST /collateral/{id}/return`). Needs `debts:manage`. `Idempotency-Key` optional, must equal `id`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoanRequest' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Debt' } } } } } }
        '200': { description: Already created (replay) }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /debts/{id}/repayments:
    post:
      tags: [Customers and debts]
      summary: Receive a repayment in cash or by mobile money (idempotent)
      description: |
        Repaying with gold is not done here: the gold is bought through `POST /transactions` with a `debt_offset` part.
        Paying more than outstanding is `422 OVERPAYMENT`. Needs `debts:manage`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepaymentRequest' }
      responses:
        '201': { description: Recorded, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Debt' } } } } } }
        '200': { description: Already recorded (replay) }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: DEBT_CLOSED, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /collateral:
    get:
      tags: [Customers and debts]
      summary: Unrefined gold the branch holds (or held) as security
      parameters:
        - { in: query, name: branchId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string, enum: [held, converted, returned] } }
      responses:
        '200': { description: Holdings, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Collateral' } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
  /collateral/{id}/return:
    post:
      tags: [Customers and debts]
      summary: Hand the unrefined gold back (only once the loan is fully paid)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { note: { type: string, maxLength: 200 } } }
      responses:
        '200': { description: Returned, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Collateral' } } } } } }
        '409': { description: 'COLLATERAL_NOT_HELD or DEBT_NOT_SETTLED', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    PermissionOverride:
      type: object
      properties:
        permission: { type: string, example: 'customers:manage' }
        effect: { type: string, enum: [allow, deny] }
    ManagedUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        role: { type: object, properties: { key: { type: string }, name: { type: string } } }
        branchIds: { type: array, items: { type: string, format: uuid } }
        isActive: { type: boolean }
        mustChangePassword: { type: boolean }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        overrides: { type: array, items: { $ref: '#/components/schemas/PermissionOverride' } }
        permissions: { type: array, items: { type: string }, description: What the person can do in total, after role and overrides. }
    CustomerRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        purchases: { type: integer, description: Cancelled purchases are not counted. }
        lifetimePaid: { type: string }
        firstPurchaseAt: { type: string, format: date-time, nullable: true }
        lastPurchaseAt: { type: string, format: date-time, nullable: true }
        owesUs: { type: string }
        weOwe: { type: string }
    CustomerDetail:
      allOf:
        - { $ref: '#/components/schemas/CustomerRow' }
        - type: object
          properties:
            transactions: { type: array, items: { type: object, properties: { id: { type: string }, reference: { type: string }, branchId: { type: string }, branchName: { type: string }, payable: { type: string }, capturedAt: { type: string }, customerName: { type: string } } } }
            debts: { type: array, items: { $ref: '#/components/schemas/Debt' } }
            held: { type: array, items: { $ref: '#/components/schemas/Collateral' } }
    TransferRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        kind: { type: string, enum: [goods, cash] }
        photos: { type: object, description: "How many photos there are at hand-over, at receipt and elsewhere. Zero is allowed and blocks nothing: the screen only says there is none, so a reviewer knows.", properties: { release: { type: integer }, receive: { type: integer }, other: { type: integer } } }
        status: { type: string, enum: [draft, released, received, received_with_discrepancy, cancelled] }
        originBranchId: { type: string, format: uuid }
        originBranchName: { type: string }
        destinationBranchId: { type: string, format: uuid }
        destinationBranchName: { type: string }
        purpose: { type: string }
        method: { type: string }
        collectorName: { type: [string, 'null'] }
        lineCount: { type: integer }
        declaredValue: { type: [string, 'null'] }
        receivedValue: { type: [string, 'null'] }
        hasDiscrepancy: { type: boolean }
        releasedAt: { type: [string, 'null'], format: date-time }
        receivedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    TransferableItem:
      type: object
      properties:
        itemId: { type: string, format: uuid }
        transactionId: { type: string, format: uuid }
        reference: { type: string }
        customerName: { type: string }
        label: { type: string }
        top: { type: string }
        down: { type: string }
        value: { type: string }
        purchasedAt: { type: string, format: date-time }
    Transfer:
      description: A transfer with everything about it. Weights and values are strings without trailing zeros.
      type: object
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        kind: { type: string, enum: [goods, cash] }
        status: { type: string, enum: [draft, released, received, received_with_discrepancy, cancelled] }
        originBranchId: { type: string, format: uuid }
        originBranchName: { type: string }
        destinationBranchId: { type: string, format: uuid }
        destinationBranchName: { type: string }
        purpose: { type: string, enum: [stock_collection, restock_funding, cash_return, payment_on_collection, other] }
        purposeNote: { type: [string, 'null'] }
        method: { type: string, enum: [collector_from_destination, staff_travelling, designated_courier, branch_delivery, other] }
        collector: { type: [object, 'null'], description: 'type, userId, name, phone, idType, idNumber, relationship, collectedAt' }
        expectedArrivalAt: { type: [string, 'null'], format: date-time }
        release: { type: [object, 'null'], description: 'by, at, note' }
        declared: { type: [object, 'null'], description: 'top, down, value, cash, cashLines (frozen at release)' }
        receipt: { type: [object, 'null'], description: 'by, at, note, top, down, value, cash, cashLines' }
        cancellation: { type: [object, 'null'], description: 'by, at, reason' }
        lines:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              lineNo: { type: integer }
              itemId: { type: [string, 'null'], format: uuid }
              description: { type: string }
              reference: { type: [string, 'null'] }
              customerName: { type: [string, 'null'] }
              releasedTop: { type: string }
              releasedDown: { type: string }
              releasedValue: { type: string }
              receivedTop: { type: [string, 'null'] }
              receivedDown: { type: [string, 'null'] }
              receivedValue: { type: [string, 'null'] }
              outcome: { type: string, enum: [pending, matched, differs, missing] }
        payments: { type: array, items: { type: object, description: 'id, direction, amount, method, purpose, externalRef, paidAt, recordedBy, note, lines' } }
        events: { type: array, items: { type: object, description: 'id, type, by, at, data' } }
        discrepancies: { type: array, items: { type: object, description: 'id, status, asset, lineId, expected, actual, difference, explanation' } }
        createdBy: { type: object }
        createdAt: { type: string, format: date-time }
    ManagedBranch:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        isMain: { type: boolean }
        timezone: { type: string }
        isActive: { type: boolean }
        dayOpen: { type: boolean }
    Role:
      type: string
      enum: [director, manager, teller]
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 128 }
        company:
          type: string
          maxLength: 40
          description: The company's short name. Optional; when omitted the server uses its configured default company (single-company installs).
    SessionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accessToken, expiresAt, user]
          properties:
            accessToken: { type: string }
            expiresAt: { type: string, format: date-time }
            user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, username, displayName, role, permissions, branchIds]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        permissions:
          type: array
          description: Fine-grained permissions such as `transactions:create` or `kumasi:set-value` (`resource:action`). The UI hides what the user cannot do; the API enforces it.
          items: { type: string }
        branchIds:
          type: array
          items: { type: string, format: uuid }
    Branch:
      type: object
      required: [id, name, code, isMain]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        isMain: { type: boolean, description: True for Kumasi }
    CurrentPrice:
      type: object
      required: [branchId, basePrice, margin, effectivePrice, source, status, asOf]
      properties:
        branchId: { type: string, format: uuid }
        basePrice: { type: string, description: 'GoldBod price per pound, GHS', example: '11458' }
        margin: { type: string, description: 'Margin set by the director, GHS per pound', example: '192' }
        effectivePrice: { type: string, description: 'basePrice + margin', example: '11650' }
        source: { type: string, enum: [goldbod, manual] }
        status:
          type: string
          enum: [approved, provisional]
          description: Provisional means the director has not approved the margin yet.
        asOf: { type: string, format: date-time }
    PayoutPolicy:
      type: string
      enum: [down, up, nearest]
    SolveStrategy:
      type: string
      enum: [fewest-notes, prefer-100s]
    NoteLines:
      type: object
      description: 'Notes handed over, keyed by denomination, for example 100 maps to 1688'
      additionalProperties: { type: integer, minimum: 1 }
    ItemInput:
      type: object
      required: [id, top, down, price]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, nullable: true, maxLength: 80 }
        top: { type: string, example: '7.77' }
        down: { type: string, example: '0.41' }
        price: { type: string, example: '11650' }
    ItemResult:
      type: object
      required: [density, karat, purity, netWeight, pounds, amount]
      properties:
        density: { type: string }
        karat: { type: string }
        purity: { type: string, description: 'Fraction, for example 0.9733' }
        netWeight: { type: string }
        pounds: { type: string }
        amount: { type: string }
    Item:
      allOf:
        - $ref: '#/components/schemas/ItemInput'
        - type: object
          required: [result]
          properties:
            result: { $ref: '#/components/schemas/ItemResult' }
    PayoutInput:
      type: object
      required: [policy, strategy, payable, lines]
      properties:
        policy: { $ref: '#/components/schemas/PayoutPolicy' }
        strategy: { $ref: '#/components/schemas/SolveStrategy' }
        payable: { type: string, description: 'Whole cedis, a multiple of 5' }
        lines: { allOf: [{ $ref: '#/components/schemas/NoteLines' }], description: 'The cash part only: payable minus the split parts. Omit when nothing is paid in cash.' }
        split:
          type: array
          description: Non-cash parts of the payment (optional)
          items: { $ref: '#/components/schemas/SplitPart' }
    SplitPart:
      type: object
      required: [method, amount]
      properties:
        method: { type: string, enum: [mobile_money, owed, debt_offset] }
        amount: { type: string, description: Whole cedis above zero, example: '5000' }
        paidByBranchId: { type: string, format: uuid, description: 'Required for mobile_money: the branch that sends it' }
        externalRef: { type: string, description: 'Mobile money reference' }
        debtId: { type: string, format: uuid, description: 'Required for debt_offset: the customer''s debt this gold settles' }
        dueDate: { type: string, format: date, description: 'owed only: when the branch promises to pay' }
        note: { type: string }
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        method: { type: string, enum: [cash, mobile_money, owed, debt_offset] }
        amount: { type: string }
        status: { type: string, enum: [paid, pending, confirmed, failed] }
        paidByBranchId: { type: string, format: uuid, nullable: true }
        externalRef: { type: string, nullable: true }
        debtId: { type: string, format: uuid, nullable: true }
        confirmedAt: { type: string, format: date-time, nullable: true }
    ResolvePaymentRequest:
      type: object
      properties:
        cashReplacements:
          type: array
          items: { type: object, properties: { amount: { type: string }, lines: { $ref: '#/components/schemas/NoteLines' } } }
        replacements:
          type: array
          items: { $ref: '#/components/schemas/SplitPart' }
    BasePriceRequest:
      type: object
      required: [basePrice]
      properties:
        basePrice: { type: string, example: '11458' }
        publishedAt: { type: string, format: date-time, nullable: true }
    MarginRequest:
      type: object
      required: [margin]
      properties:
        margin: { type: string, example: '192' }
        approve: { type: boolean, default: false }
    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string, nullable: true }
        atBranch: { type: boolean, description: 'Has sold at the branch asked about' }
    Debt:
      type: object
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        direction: { type: string, enum: [receivable, payable] }
        party:
          type: object
          properties:
            type: { type: string, enum: [customer, staff, other] }
            name: { type: string }
            customerId: { type: string, format: uuid, nullable: true }
            phone: { type: string, nullable: true }
        principal: { type: string }
        repaid: { type: string }
        outstanding: { type: string }
        reason: { type: string, nullable: true }
        issuedAt: { type: string, format: date-time }
        dueDate: { type: string, format: date, nullable: true }
        status: { type: string, enum: [open, settled] }
        sourceTransactionId: { type: string, format: uuid, nullable: true }
        collateral: { allOf: [{ $ref: '#/components/schemas/CollateralBrief' }], nullable: true }
        repayments:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              amount: { type: string }
              method: { type: string, enum: [cash, mobile_money, bank, other, gold] }
              receivedAt: { type: string, format: date-time }
              receivedBy: { $ref: '#/components/schemas/Person' }
              transactionId: { type: string, format: uuid, nullable: true }
              note: { type: string, nullable: true }
    CollateralBrief:
      type: object
      properties:
        id: { type: string, format: uuid }
        topWeight: { type: string }
        status: { type: string, enum: [held, converted, returned] }
        description: { type: string, nullable: true }
    Collateral:
      type: object
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        debtId: { type: string, format: uuid }
        status: { type: string, enum: [held, converted, returned] }
        topWeight: { type: string }
        description: { type: string, nullable: true }
        receivedAt: { type: string, format: date-time }
        receivedBy: { $ref: '#/components/schemas/Person' }
        customer: { $ref: '#/components/schemas/Customer' }
        debtOutstanding: { type: string }
        convertedTransactionId: { type: string, format: uuid, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        closeNote: { type: string, nullable: true }
    LoanRequest:
      type: object
      required: [id, branchId, customer, principal, lines, capturedAt]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        partyType: { type: string, enum: [customer, staff, other], default: customer }
        customer:
          type: object
          required: [name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            phone: { type: string, description: Required when partyType is customer }
        principal: { type: string, description: Whole cedis }
        lines: { $ref: '#/components/schemas/NoteLines' }
        reason: { type: string }
        dueDate: { type: string, format: date }
        collateral:
          type: object
          description: Unrefined gold kept as security. Only the top weight is taken.
          properties:
            topWeight: { type: string, example: '24.5' }
            description: { type: string }
        capturedAt: { type: string, format: date-time }
    RepaymentRequest:
      type: object
      required: [id, amount, capturedAt]
      properties:
        id: { type: string, format: uuid }
        amount: { type: string }
        method: { type: string, enum: [cash, mobile_money, bank, other], default: cash }
        lines: { $ref: '#/components/schemas/NoteLines' }
        paidByBranchId: { type: string, format: uuid }
        externalRef: { type: string }
        note: { type: string }
        capturedAt: { type: string, format: date-time }
    Payout:
      allOf:
        - $ref: '#/components/schemas/PayoutInput'
        - type: object
          required: [difference, totalNotes]
          properties:
            difference: { type: string, description: 'payable minus calculated amount; negative when the customer is paid less' }
            totalNotes: { type: integer }
    CreateTransactionRequest:
      type: object
      required: [id, branchId, customerName, items, clientAmount, payout, capturedAt, priceAsOf]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        customerName: { type: string, minLength: 1, maxLength: 120 }
        customerPhone: { type: string, nullable: true, maxLength: 32 }
        items:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/ItemInput' }
        clientAmount: { type: string, description: 'Total the device calculated, used to detect disagreement' }
        payout: { $ref: '#/components/schemas/PayoutInput' }
        capturedAt: { type: string, format: date-time, description: 'Device time when the teller saved it' }
        priceAsOf: { type: string, format: date-time, description: 'When the price used was published' }
        customerId: { type: string, format: uuid, nullable: true, description: 'An existing customer; otherwise one is found or created from name and phone' }
        collateralId: { type: string, format: uuid, nullable: true, description: 'Unrefined gold held as security that this purchase is the refined result of' }
        originTown: { type: object, nullable: true, description: 'Where the gold comes from (optional). An existing name is matched ignoring case and spacing; a new name is added to the company list.', properties: { id: { type: string, format: uuid, nullable: true }, name: { type: string } } }
        representative:
          type: object
          nullable: true
          description: |
            Someone bringing the gold for the customer. The purchase (and any debts) belong to the customer, who must be identified: send `customerId`, or
            a phone number (`REPRESENTATIVE_NEEDS_CUSTOMER` otherwise). The representative is only written on the purchase; they do not become a customer.
          properties:
            name: { type: string, maxLength: 120 }
            phone: { type: string, nullable: true, maxLength: 32 }
    Transaction:
      type: object
      required: [id, branchId, reference, customerName, status, items, formulaVersion, calculatedAmount, payout, capturedAt, createdAt, createdBy, flags]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        reference: { type: string, example: TKW-20261022-0007 }
        customerName: { type: string }
        customerPhone: { type: string, nullable: true }
        originTown: { type: object, nullable: true, properties: { id: { type: string, format: uuid }, name: { type: string } } }
        representative: { type: object, nullable: true, description: 'Who brought the gold when it was not the customer: name, phone', properties: { name: { type: string }, phone: { type: string, nullable: true } } }
        status: { type: string, enum: [saved, paid, void] }
        items:
          type: array
          items: { $ref: '#/components/schemas/Item' }
        formulaVersion: { type: string, example: ExcelV1 }
        calculatedAmount: { type: string }
        payout: { $ref: '#/components/schemas/Payout' }
        payments:
          type: array
          items: { $ref: '#/components/schemas/Payment' }
        capturedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        createdBy:
          type: object
          required: [id, displayName]
          properties:
            id: { type: string, format: uuid }
            displayName: { type: string }
        flags:
          type: array
          items: { type: string, enum: [OFFLINE_ENTRY, CALC_MISMATCH, PRICE_STALE, NO_OPEN_DAY] }
        priceAsOf: { type: string, format: date-time, description: When the price used was fixed. }
        voidedAt: { type: string, format: date-time, nullable: true }
        voidReason: { type: string, nullable: true }
        voidedBy:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            displayName: { type: string }
    TransactionResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Transaction' }
    DrawerLines:
      type: object
      description: 'Notes by denomination, e.g. {"100": 1688}. Keys are 200, 100, 50, 20, 10, 5. Counts are whole numbers; a balance can be negative (see NEGATIVE_NOTES).'
      additionalProperties: { type: integer }
    CountLines:
      type: object
      description: A count of notes. Counts are positive whole numbers; zero counts are left out.
      additionalProperties: { type: integer, minimum: 1 }
    Person:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
    Day:
      type: object
      required: [id, branchId, businessDate, status, opening, openedAt, openedBy, closing, flags]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        businessDate: { type: string, format: date, description: 'Date in the branch local time' }
        status: { type: string, enum: [open, closed] }
        opening:
          type: object
          required: [lines, source]
          properties:
            lines: { $ref: '#/components/schemas/CountLines' }
            source: { type: string, enum: [counted, carried], description: '`carried` = taken from the previous closing count unchanged' }
        openedAt: { type: string, format: date-time }
        openedBy: { $ref: '#/components/schemas/Person' }
        closing:
          nullable: true
          description: Present once the day is closed.
          type: object
          properties:
            closedAt: { type: string, format: date-time }
            closedBy: { $ref: '#/components/schemas/Person' }
            confirmation:
              type: object
              properties:
                version: { type: string, example: v3 }
                text: { type: string, description: The exact wording the teller accepted }
            figures:
              type: array
              description: The seven reconciled figures, in this order - cash, goods_top, goods_down, goods_value, debt, payable, custody_top
              items: { $ref: '#/components/schemas/ClosingFigure' }
            cash:
              type: object
              properties:
                expected: { $ref: '#/components/schemas/DrawerLines' }
                counted: { $ref: '#/components/schemas/DrawerLines' }
            signoff:
              type: object
              properties:
                status: { type: string, enum: [not_required, pending, approved, rejected] }
                by: { allOf: [{ $ref: '#/components/schemas/Person' }], nullable: true }
                at: { type: string, format: date-time, nullable: true }
                note: { type: string, nullable: true }
        flags:
          type: array
          items: { type: string, enum: [OFFLINE_ENTRY, OPENING_DIFFERS, CLOSING_DIFFERS] }
    Movement:
      type: object
      required: [id, dayId, kind, lines, note, capturedAt, createdBy]
      properties:
        id: { type: string, format: uuid }
        dayId: { type: string, format: uuid }
        kind: { type: string, enum: [topup, withdrawal] }
        lines: { $ref: '#/components/schemas/CountLines' }
        note: { type: string, maxLength: 200 }
        capturedAt: { type: string, format: date-time }
        createdBy: { $ref: '#/components/schemas/Person' }
    DayState:
      type: object
      required: [day, balance, movements, appliedIds, carryOver, asOf]
      properties:
        day: { allOf: [{ $ref: '#/components/schemas/Day' }], nullable: true }
        balance: { allOf: [{ $ref: '#/components/schemas/DrawerLines' }], nullable: true, description: 'Only while the day is open' }
        movements: { type: array, items: { $ref: '#/components/schemas/Movement' } }
        appliedIds: { type: array, items: { type: string }, description: 'Ids of transactions, movements and day commands already included' }
        carryOver: { allOf: [{ $ref: '#/components/schemas/CountLines' }], nullable: true, description: 'Closing count of the last closed day' }
        asOf: { type: string, format: date-time }
    OpenDayRequest:
      type: object
      required: [id, branchId, businessDate, lines, source, capturedAt]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        businessDate: { type: string, format: date }
        lines: { $ref: '#/components/schemas/CountLines' }
        source: { type: string, enum: [counted, carried] }
        capturedAt: { type: string, format: date-time }
        explanation: { type: string, nullable: true, minLength: 5, description: 'Required when the count differs from the books' }
    ClosingFigure:
      type: object
      properties:
        asset: { type: string, enum: [cash, goods_top, goods_down, goods_value, debt, payable, custody_top] }
        expected: { type: string, description: What the books said }
        actual: { type: string, description: What the teller reported }
        difference: { type: string, description: actual minus expected }
        outcome: { type: string, enum: [balanced, surplus, shortage], description: Worked out by the database }
        explanation: { type: string, nullable: true }
        detail: { type: object, nullable: true, description: 'cash only: difference per note, e.g. {"100": -1}' }
    ClosingPreview:
      type: object
      properties:
        dayId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        expected:
          type: object
          properties:
            cash: { type: object, properties: { lines: { $ref: '#/components/schemas/DrawerLines' }, value: { type: string } } }
            goodsTop: { type: string }
            goodsDown: { type: string }
            goodsValue: { type: string }
            debt: { type: string }
            payable: { type: string }
            custodyTop: { type: string }
        pendingPayments: { type: integer }
        confirmation:
          type: object
          properties:
            version: { type: string, example: v3 }
            text: { type: string }
        asOf: { type: string, format: date-time }
    CloseDayRequest:
      type: object
      required: [id, dayId, branchId, declared, confirmation, capturedAt]
      properties:
        id: { type: string, format: uuid, description: Command id, also the Idempotency-Key when sent }
        dayId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        declared:
          type: object
          required: [cash, goodsTop, goodsDown, goodsValue, debt, payable, custodyTop]
          properties:
            cash: { allOf: [{ $ref: '#/components/schemas/CountLines' }], description: 'Notes counted in the drawer; {} for an empty drawer' }
            goodsTop: { type: string, example: '7.77' }
            goodsDown: { type: string, example: '0.41' }
            goodsValue: { type: string, example: '1000' }
            debt: { type: string, example: '500' }
            payable: { type: string, example: '0' }
            custodyTop: { type: string, example: '24.5' }
        explanations:
          type: object
          description: One reason (at least 5 characters) for each figure that differs from the books
          additionalProperties: { type: string }
          example: { cash: 'one 100 note missing from the drawer' }
        confirmation:
          type: object
          required: [accepted, version]
          properties:
            accepted: { type: boolean }
            version: { type: string, example: v3 }
        capturedAt: { type: string, format: date-time }
    SignoffRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approved, rejected] }
        note: { type: string, nullable: true, description: Required (5+ characters) when rejecting }
    MovementRequest:
      type: object
      required: [id, dayId, branchId, kind, lines, note, capturedAt]
      properties:
        id: { type: string, format: uuid }
        dayId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        kind: { type: string, enum: [topup, withdrawal] }
        lines: { $ref: '#/components/schemas/CountLines' }
        note: { type: string, minLength: 1, maxLength: 200 }
        capturedAt: { type: string, format: date-time }
    DayResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Day' }
    MovementResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Movement' }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, traceId]
          properties:
            code:
              type: string
              description: |
                Stable code. Slice 1: AUTH_INVALID_CREDENTIALS, AUTH_TOKEN_EXPIRED, AUTH_REFRESH_INVALID, AUTH_LOCKED,
                FORBIDDEN, BRANCH_NOT_ASSIGNED, VALIDATION_FAILED, RATE_LIMITED, NOT_FOUND, INTERNAL.
                Transactions add PAYOUT_MISMATCH (lines do not add up to payable, or payable is not a multiple of 5).
                Cash drawer adds DAY_ALREADY_OPEN, DAY_CLOSED, DAY_ALREADY_CLOSED, NOTHING_TO_SIGN, CONFIRMATION_OUTDATED (409),
                EXPLANATION_REQUIRED, CONFIRMATION_REQUIRED (422) and SELF_SIGNOFF (403).
                Prices: PRICE_NOT_SET (404), NO_BASE_PRICE. Payments and debts: ALREADY_RESOLVED, NOT_MOBILE_MONEY, DEBT_CLOSED,
                DEBT_NOT_CUSTOMERS, DEBT_NOT_SETTLED, COLLATERAL_NOT_HELD, COLLATERAL_MISMATCH (409), OVERPAYMENT,
                CUSTOMER_REQUIRED, BAD_DENOMINATION, BAD_COUNT (422), BAD_REQUEST (400), DUPLICATE (409).
            message: { type: string, description: Safe to show to a person }
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
            traceId: { type: string }